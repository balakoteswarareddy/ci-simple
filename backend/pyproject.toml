[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-agent"
version = "0.1.0"
description = "Production-grade AI CI agent: repo intelligence, knowledge-grounded planning, OPA governance, deterministic rendering."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "jsonschema>=4.22",
  "prometheus_client>=0.20",
  "tenacity>=9.0",
  "redis>=5.0",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
